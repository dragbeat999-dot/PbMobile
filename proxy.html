<!DOCTYPE html>
<html>
<head>
    <title>PB Mod Proxy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        #loading { color: #0f0; font-family: monospace; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div id="loading">Menghubungkan ke PB Mobile...</div>
    <iframe id="gameFrame" src="about:blank"></iframe>

    <script>
        // Daftarin Service Worker dulu, baru load game
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('gameFrame').src = 'https://pbmobile.app/';
            })
            .catch(err => {
                document.getElementById('loading').innerText = 'Error SW: ' + err.message;
            });
        } else {
            document.getElementById('loading').innerText = 'Browser gak support Service Worker';
        }
    </script>
</body>
</html>
